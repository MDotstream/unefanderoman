<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Une_fan_de_roman</title>
    <link rel="icon" href="../../image/icon.png">
    <link rel="stylesheet" href="../../style.css" />
</head>

<body>

    <!-- Premier formulaire -->
    <div class="form-container">
        <h1 class="form-title">Créer un nouveau texte</h1>
        <form class="studio-form" id="form-texte">
            <div class="form-group">
                <label for="titre">Titre</label>
                <input type="text" id="titre" name="titre" placeholder="Entrez le titre..." required>
            </div>

            <div class="form-group">
                <label for="contenu">Contenu</label>
                <textarea id="contenu" name="contenu" placeholder="Écrivez votre texte ici..." required></textarea>
            </div>

            <button type="button" class="btn btn-primary" id="btn-suivant">Envoyer</button>
        </form>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal-overlay"></div>
    <div class="modal-form" id="modal-form">
        <button class="btn-close" id="btn-close">✕</button>
        <h2 class="form-title">Vos informations</h2>
        <form class="studio-form" id="form-infos">
            <div class="form-group">
                <label for="nom">Nom</label>
                <input type="text" id="nom" placeholder="Entrez votre nom..." required>
            </div>

            <div class="form-group">
                <label for="telephone">Numéro de téléphone  (conseillé)</label>
                <input type="tel" id="telephone" placeholder="Entrez votre numéro...">
            </div>

            <button type="submit" class="btn btn-primary">Confirmer</button>
        </form>
    </div>

    <!-- SUPABASE (VERSION CORRECTE POUR HTML PUR) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        const SUPABASE_URL = "https://falvqjhgsksffhdjdmcn.supabase.co";
        const SUPABASE_KEY = "sb_publishable_YK4zRP2nn0K8gkvAyX3_0w_JAVwVf5T";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );
    </script>

    <!-- SCRIPT PRINCIPAL -->
    <script>
        const formTexte = document.getElementById('form-texte');
        const modalForm = document.getElementById('modal-form');
        const modalOverlay = document.getElementById('modal-overlay');
        const btnSuivant = document.getElementById('btn-suivant');
        const btnClose = document.getElementById('btn-close');
        const formInfos = document.getElementById('form-infos');

        // Ouvre le modal
        btnSuivant.addEventListener('click', () => {
            if (formTexte.checkValidity()) {
                modalForm.classList.add('active');
                modalOverlay.classList.add('active');
            } else {
                formTexte.reportValidity();
            }
        });

        // Ferme le modal
        btnClose.addEventListener('click', () => {
            modalForm.classList.remove('active');
            modalOverlay.classList.remove('active');
        });

        modalOverlay.addEventListener('click', () => {
            modalForm.classList.remove('active');
            modalOverlay.classList.remove('active');
        });

        // ENVOI VERS SUPABASE (FIX FINAL)
        formInfos.addEventListener('submit', async (e) => {
            e.preventDefault();

            const titre = document.getElementById('titre').value;
            const contenu = document.getElementById('contenu').value;
            const nom = document.getElementById('nom').value;
            const telephone = document.getElementById('telephone').value;

            const { data, error } = await supabaseClient
                .from('romans')
                .insert([{ titre, contenu, nom, telephone }])
                .select()
                .single();

            if (error) {
                console.error(error);
                alert("Erreur lors de l'envoi (voir console)");
                return;
            }

            // Redirection
            window.location.href = `send.html?id=${data.id}`;
        });
    </script>

</body>
</html>

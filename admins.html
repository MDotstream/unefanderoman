<script>
// Fonction pour détecter si c'est un mobile
function isMobile() {
  return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
}

function handleNavDisplay() {
  const nav = document.getElementById('main-nav');
  const menuBtn = document.getElementById('menu-btn');
  if (isMobile()) {
    nav.style.display = 'none';
    menuBtn.style.display = 'block';
  } else {
    nav.style.display = '';
    menuBtn.style.display = 'none';
  }
}

window.addEventListener('DOMContentLoaded', handleNavDisplay);
window.addEventListener('resize', handleNavDisplay);

document.getElementById('menu-btn').onclick = function() {
  window.location.href = 'admins.html?nav';
};
</script>

<script>
  // Montre le menu mobile si ?nav dans l'URL
  if (window.location.search.includes('nav')) {
    // Enlève le contenu principal et le padding pour s'assurer que le menu est visible
    const main = document.getElementById('main-content');
    if (main) main.remove();
    document.body.style.paddingTop = '0';
    // Injecte le menu en haut du body et s'assure qu'il occupe tout l'écran

    `);
    // S'assure que le scroll revient en haut
    window.scrollTo(0, 0);
  }
</script>
